# =====================================================================
#  Example 2 (high intensity, E0 = 1200 GV/m) — both levels fully ionized everywhere
#
#  Same focused-Helium setup as inputdeck/He_focus, scanned over peak
#  field E0 to show the ionization regimes. Compare the three runs by
#  opening inputdeck/plots.ipynb in VS Code or Jupyter.
#
#  Run:  laserion   (or  mpirun -n 4 laserion)
# =====================================================================

[run]
working_dir      = "."
gas              = "He"
memory_total_gib = 2

[field_cache]
mode = "auto"

[grid]
t_min        = -240.0
t_max        =  240.0
dt           =  0.04
ax1_min      =  -60.0
ax1_max      =   60.0
dx1          =    1.0
spatial_axes = "z"
fixed.x      = 0.0
fixed.y      = 0.0

[[laser]]
E0              = 1200.0
wavelength      = 0.8
phase0          = 0.0
k_vec           = [0.0, 0.0, 1.0]
r_start         = [0.0, 0.0, 0.0]
temporal_type   = "gaussian"
tau             = 10.0
transverse_type = "gaussian"
w0              = 2.0
zf              = 0.0
polarization    = "linear"
angle           = 0.0

[ionization_frac]
