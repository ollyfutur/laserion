[run]
working_dir      = "."
gas              = "He"
memory_total_gib = 10

[field_cache]
mode = "auto"

[grid]
t_min        = -200.0
t_max        =  200.0
dt           =  0.02
spatial_axes = "zx"
fixed.y      = 0.0
ax1_min      = -10.0
ax1_max      =  10.0
dx1          =  0.05
ax2_min      = -10.0
ax2_max      =  10.0
dx2          =  0.5

[[laser]]
maxwell_correction = true
E0              = 100.0
wavelength      = 1.0
phase0          = 0.0
k_vec           = [0.0, 0.0, 1.0]
r_start         = [0.0, 0.0, 0.0]
temporal_type   = "gaussian"
tau             = 30.0
transverse_type = "gaussian"
w0              = 4.0
zf              = 0.0
polarization    = "linear"
angle           = 0.0

[[field_diag]]
axes       = "tz"
components = ["Ex", "Ey", "Ez"]

[[field_diag]]
axes       = "t"
components = ["Ex", "Ey", "Ez"]
pos_z      = 0
pos_x      = 0.2

[[field_diag]]
axes       = "zx"
components = ["Ex", "Ey", "Ez"]
pos_t = 0
