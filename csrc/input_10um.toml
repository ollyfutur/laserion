# =========================
# 0) General run parameters
# =========================

[run]
working_dir = "./test3"
gas = "He"

# =========================
# 1) Field cache parameters
# =========================

[field_cache]
mode = "auto" # "auto" | "compute" | "load" | "off"

# ==============================
# 2) Temporal/Spatial parameters
# ==============================

[grid]
t_min = -2000.0
t_max = 2000.0
dt = 0.2

# 1D: "x","y","z" ; 2D: "xy","xz","yz" (and permutations)
spatial_axes = "zx"
fixed.y = 20

# Axis definitions:
# ax1 corresponds to first letter in spatial_axes, ax2 to second letter (if present)
ax1_min = -50
ax1_max = 50
dx1 = 2

ax2_min = -50
ax2_max = 50
dx2 = 2
# For 1D, omit ax2_*.

# =========================
# 3) Lasers (>=1 required)
# =========================

[[laser]]
type = "standard"
E0 = 200.0
wavelength = 10
phase0 = 0.0
k_vec = [0.0, 0.0, 1.0]
r_start = [0.0, 0.0, 0.0]
use_retarded_time = true
temporal_type = "gaussian"
tau = 750.0
transverse_type = "gaussian"
w0 = 20.0
zf = 0.0
polarization = "circular"
sense = "right"
angle = 0.0

# ====================
# 4) Field diagnostics
# ====================

[[field_diag]]
components = ["Ex", "Ey"]
axes = "tz"
pos_x = 0.10
pos_y = 0.0
pos_z = 0.0
pos_t = 0

[[field_diag]]
components = ["Ex", "Ey"]
axes = "t"
pos_x = 0
pos_y = 0.0
pos_z = 0
pos_t = 10.0

# =========================
# 5) Ionization diagnostics
# =========================

[ionization_frac]

# =========================
# 6) Phase-space diagnostic
# =========================

[[phase_space]]
phase_space = "pxpy"
envelope_cut = 1e-6
bins1 = { nbins = 2000, min = -1.0, max = 1.0 }
bins2 = { nbins = 2000, min = -1.0, max = 1.0 }

[[particles]]
#region = { xmin = -1, xmax = 1, ymin = -10, ymax = 0, zmin = -10, zmax = 10 }
sampling = { nx = 20, ny = 1, nz = 20 }
ppc = 100
seed = 0
